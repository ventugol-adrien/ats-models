[project]
name = "ats-models"
version = "0.1.0"
description = "Database-aligned data contracts for jobs, resumes, and applications"
readme = "README.md"
authors = [{ name = "Adrien Ventugol", email = "ventugol.adrien@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["pydantic>=2.14.3"]

[project.scripts]
ats-models = "ats_models.cli:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["jsonschema>=4.26.0", "pyright>=1.1.414"]
